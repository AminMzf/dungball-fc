<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DungBall FC</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main><header><div><p class="eyebrow">EXPERIMENT 001</p><h1>DungBall FC</h1><p>A plastic fly brain learns the beautiful game.</p></div><div class="live"><i></i> LIVE TRAINING</div></header>
  <section class="layout"><div class="card arena-card"><canvas id="arena" width="1000" height="600"></canvas><div class="controls"><button data-api="pause">Pause</button><button data-api="mode">Training / Evaluation</button><button class="danger" data-api="reset">Reset brain</button></div></div>
  <aside><div class="card stats"><div><span>Episode</span><strong id="episode">–</strong></div><div><span>Goals</span><strong id="goals">–</strong></div><div><span>Mode</span><strong id="mode">–</strong></div></div><div class="card brain"><h2>Neural activity</h2><div id="bars"></div><h2>Dopamine</h2><div class="dopamine"><i id="dopamine"></i></div><p id="reward"></p></div><div class="card note"><b>MVP brain</b><p>This uses a small synthetic plastic policy. MaleCNS connectivity is the next adapter—not a claim that a biological fly learned soccer.</p></div></aside></section></main><script src="app.js"></script>
</body></html>
